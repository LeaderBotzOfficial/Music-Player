    <style>
        :root {
            --neon-green: #145c14; 
            --neon-glow: #39FF14;
            --neon-blue: #00f3ff;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent side pulling on mobile */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none; 
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .bg-animate {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(57, 255, 20, 0.2), transparent 60%),
                        radial-gradient(circle at 60% 70%, rgba(0, 243, 255, 0.2), transparent 60%);
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .player-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .brand {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        /* Player Box (Glass UI) */
        .player-box {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Internal Add Button */
        .add-btn {
            background: var(--neon-green);
            color: white;
            border: 1px solid var(--neon-glow);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(20, 92, 20, 0.5);
            align-self: center;
        }

        #song-name {
            color: var(--neon-blue);
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 5px;
        }

        .timeline-container { width: 100%; }
        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-glow);
            cursor: pointer;
            touch-action: auto; /* Allow moving the slider */
        }
        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ccc;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .play-pause { width: 60px; height: 60px; font-size: 1.5rem; color: var(--neon-glow); }

        /* Playlist Box */
        #playlist-container {
            display: none;
            max-height: 180px;
            overflow-y: auto;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            padding: 10px;
            touch-action: auto; /* Allow scrolling playlist */
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: white;
        }

        .song-item.active {
            background: rgba(57, 255, 20, 0.15);
            color: var(--neon-glow);
            border-left: 4px solid var(--neon-glow);
        }

        .song-title-list { flex: 1; cursor: pointer; text-align: left; padding-left: 10px; }

        .del-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #ff4d4d;
            width: 30px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #playlist-container::-webkit-scrollbar { width: 4px; }
        #playlist-container::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        input[type="file"] { display: none; }

    <div class="bg-animate"></div>

    <div class="player-wrapper">
        <div class="brand">LEADER MP3 PLAYER</div>
        
        <div class="player-box">
            <button class="add-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-plus-circle"></i> Add Songs
            </button>
            <input type="file" id="fileInput" accept="audio/*" multiple>

            <div id="song-name">No track playing</div>
            
            <div class="timeline-container">
                <input type="range" id="seek-bar" value="0">
                <div class="time-labels">
                    <span id="cur-time">0:00</span>
                    <span id="dur-time">0:00</span>
                </div>
            </div>

            <div class="controls">
                <div class="ctrl-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></div>
                <div class="ctrl-btn play-pause" id="playBtn" onclick="togglePlay()">
                    <i class="fas fa-play"></i>
                </div>
                <div class="ctrl-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></div>
            </div>
        </div>

        <div id="playlist-container"></div>
    </div>





    <script>
        const audio = new Audio();
        const dbName = "LeaderBotzDB";
        let db, songs = [], currentIndex = -1, playingSongId = null;

        const playBtn = document.getElementById('playBtn');
        const songNameDisplay = document.getElementById('song-name');
        const seekBar = document.getElementById('seek-bar');
        const curTimeText = document.getElementById('cur-time');
        const durTimeText = document.getElementById('dur-time');
        const playlistBox = document.getElementById('playlist-container');

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = e => {
            db = e.target.result;
            loadPlaylist();
        };

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const transaction = db.transaction(["songs"], "readwrite");
                transaction.objectStore("songs").add({ name: file.name, data: file });
            }
            loadPlaylist(true); 
        });

        function loadPlaylist(autoPlayFirst = false) {
            const transaction = db.transaction(["songs"], "readonly");
            const request = transaction.objectStore("songs").getAll();
            request.onsuccess = () => {
                songs = request.result.reverse(); 
                if (playingSongId !== null) {
                    currentIndex = songs.findIndex(s => s.id === playingSongId);
                }
                renderUI();
                if (songs.length > 0) {
                    playlistBox.style.display = "block";
                    const lastID = localStorage.getItem('lastID');
                    const lastTime = localStorage.getItem('lastTime');
                    if (autoPlayFirst) {
                        playSong(0);
                    } else if (lastID && currentIndex === -1) {
                        let idx = songs.findIndex(s => s.id == lastID);
                        if (idx !== -1) resumeSong(idx, lastTime);
                    }
                } else {
                    playlistBox.style.display = "none";
                    resetPlayerDisplay();
                }
            };
        }

        function renderUI() {
            playlistBox.innerHTML = '';
            songs.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = `song-item ${i === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="song-title-list" onclick="playSong(${i})">${s.name}</div>
                    <button class="del-btn" onclick="deleteSong(${s.id})"><i class="fas fa-trash-alt"></i></button>
                `;
                playlistBox.appendChild(item);
            });
        }

        function playSong(index) {
            if (!songs[index]) return;
            currentIndex = index;
            const song = songs[index];
            playingSongId = song.id;
            if (audio.src) URL.revokeObjectURL(audio.src);
            audio.src = URL.createObjectURL(song.data);
            songNameDisplay.innerText = song.name;
            audio.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            localStorage.setItem('lastID', song.id);
            renderUI();
        }

        function resumeSong(index, time) {
            currentIndex = index;
            const song = songs[index];
            playingSongId = song.id;
            audio.src = URL.createObjectURL(song.data);
            songNameDisplay.innerText = song.name;
            audio.currentTime = time || 0;
            renderUI();
        }

        function togglePlay() {
            if (songs.length === 0) return;
            if (!audio.src) { playSong(0); return; }
            if (audio.paused) { audio.play(); playBtn.innerHTML = '<i class="fas fa-pause"></i>'; }
            else { audio.pause(); playBtn.innerHTML = '<i class="fas fa-play"></i>'; }
        }

        function nextSong() { 
            if (songs.length === 0) return;
            currentIndex = (currentIndex + 1) % songs.length; 
            playSong(currentIndex); 
        }

        function prevSong() { 
            if (songs.length === 0) return;
            currentIndex = (currentIndex - 1 + songs.length) % songs.length; 
            playSong(currentIndex); 
        }

        function deleteSong(id) {
            const transaction = db.transaction(["songs"], "readwrite");
            transaction.objectStore("songs").delete(id);
            transaction.oncomplete = () => {
                if (playingSongId === id) {
                    audio.pause();
                    audio.src = "";
                    playingSongId = null;
                    currentIndex = -1;
                    resetPlayerDisplay();
                }
                loadPlaylist();
            };
        }

        function resetPlayerDisplay() {
            songNameDisplay.innerText = "Add songs...";
            curTimeText.innerText = "0:00";
            durTimeText.innerText = "0:00";
            seekBar.value = 0;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            localStorage.removeItem('lastID');
            localStorage.removeItem('lastTime');
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
                curTimeText.innerText = formatTime(audio.currentTime);
                durTimeText.innerText = formatTime(audio.duration);
                if (playingSongId) localStorage.setItem('lastTime', audio.currentTime);
            }
        };

        seekBar.oninput = () => { audio.currentTime = (seekBar.value / 100) * audio.duration; };
        audio.onended = nextSong;

        function formatTime(sec) {
            let m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

const sidebar = document.getElementById('sidebar');

    }

// Live Date and Time function
function updateTime() {
    const now = new Date();
    
    const options = { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
    };
    
    document.getElementById('liveClock').innerText = now.toLocaleString('en-US', options);
}

// Oru oru second-kum time update aagum
setInterval(updateTime, 1000);
updateTime(); // Initial call

};
